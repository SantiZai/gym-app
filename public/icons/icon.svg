<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <rect width="1024" height="1024" rx="240" fill="#2563eb"/>
  <!-- H de Habitus: los trazos verticales evocan discos, el travesaño una barra -->
  <rect x="262" y="312" width="112" height="400" rx="56" fill="#ffffff"/>
  <rect x="650" y="312" width="112" height="400" rx="56" fill="#ffffff"/>
  <!-- travesaño ascendente = progreso / hábito -->
  <g transform="rotate(-8 512 512)">
    <rect x="374" y="484" width="276" height="56" rx="28" fill="#ffffff"/>
  </g>
  <!-- punto de impulso: el día uno -->
  <circle cx="762" cy="262" r="52" fill="#BFDBFE"/>
  <circle cx="762" cy="262" r="22" fill="#2563eb"/>
</svg>
